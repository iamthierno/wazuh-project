<!--
  Configuration centralisée — groupe "macos"
  Les unified logs (sudo, sshd, connexions, TCC) sont déjà collectés par défaut.
  Ajout : intégrité des éléments de persistance.
-->
<agent_config os="Darwin">

  <syscheck>
    <directories realtime="yes" check_all="yes">/Library/LaunchDaemons,/Library/LaunchAgents</directories>
    <directories realtime="yes" check_all="yes">/etc/sudoers,/etc/ssh</directories>
    <directories check_all="yes">/Applications</directories>
  </syscheck>

</agent_config>
