<!--
  Configuration centralisée — groupe "linux"
  Poussée automatiquement par le manager à tous les agents du groupe.
  Complète la configuration locale de l'agent (syslog, auth.log, dpkg/yum sont
  déjà suivis par défaut).
-->
<agent_config>

  <!-- Journal d'audit (auditd) : commandes root, accès sensibles -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Intégrité des fichiers sensibles (temps réel) -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ssh,/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes">/etc/passwd,/etc/shadow,/etc/group,/etc/sudoers</directories>
    <directories realtime="yes" check_all="yes">/etc/cron.d,/etc/crontab,/var/spool/cron</directories>
    <directories realtime="yes" check_all="yes">/etc/systemd/system</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/root/.ssh,/etc/hosts</directories>
  </syscheck>

  <!-- Inventaire système (paquets, ports, processus) pour la détection de vulnérabilités -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

</agent_config>
